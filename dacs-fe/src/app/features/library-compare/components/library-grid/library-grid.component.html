<div class="library-wrap">
  <div class="grid">
    <div class="game" *ngFor="let g of games" (mouseenter)="hover.emit(g)" (mouseleave)="hover.emit(null)">
      <div class="left">
        <div class="title">{{g.name}}</div>
        <div class="tags">{{g.genres?.join(', ')}}</div>
      </div>
      <div class="right">
        <div class="copies" title="Owners">{{g.copies}}</div>
        <div class="alert" *ngIf="g.hiddenForSexContent">⚠</div>
      </div>
    </div>
  </div>
</div>
