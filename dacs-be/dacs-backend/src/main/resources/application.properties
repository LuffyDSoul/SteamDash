spring.config.import=optional:file:../../example.env[.properties]

application.name=ms-dacs2023-backend

dacs.exceptions.code-prefix=backend

spring.application.name=backend
spring.profiles.active=@activeProfile@

server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=ms_dacs2025_access_
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)


# Configuración PostgreSQL corregida (sin serverTimezone que es para MySQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true

# Configuración de timezone (UTC es universalmente compatible con PostgreSQL)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
# Cambio de 'validate' a 'update' para que cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto = update