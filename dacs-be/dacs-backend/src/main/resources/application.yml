management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: "health,info"
server:
  port :  9003
  servlet:
    contextPath: /backend
  tomcat:
    connection-timeout: 180000
    threads:
      max: 200
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB