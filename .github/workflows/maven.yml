name: Java CI - Tests

on:
  push:
    branches: [ "develop", "release", "test/testUnitarios" ]
  pull_request:
    branches: [ "develop", "release" ]

jobs:
  build:
    name: Build and run tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: CI

    strategy:
      matrix:
        service: [ "dacs-backend", "dacs-bff", "dacs-conector" ]

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: ${{ secrets.PG_DB }}
          POSTGRES_USER: ${{ secrets.PG_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PG_PASS }}
        options: >-
          --health-cmd "pg_isready -U ${POSTGRES_USER}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Wait for Postgres
      run: |
        echo "Waiting for Postgres to be reachable on localhost:5432..."
        for i in {1..60}; do
          if bash -c '</dev/tcp/localhost/5432' >/dev/null 2>&1; then
            echo "Postgres is accepting connections"
            break
          fi
          sleep 1
        done

    - name: Run Maven tests
      run: mvn -B -DskipTests=false -DtrimStackTrace=false verify --fail-at-end
      working-directory: ./dacs-be/${{ matrix.service }}

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.service }}
        path: |
          ./dacs-be/${{ matrix.service }}/**/target/surefire-reports/**
          ./dacs-be/${{ matrix.service }}/**/target/failsafe-reports/**
